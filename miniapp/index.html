<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рулетка призов</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    #wheel { display: flex; overflow-x: auto; width: 90%; margin: 0 auto; border: 2px solid #ccc; border-radius: 10px; padding: 20px; scroll-behavior: smooth; }
    .prize { flex: 0 0 auto; width: 120px; height: 120px; margin: 0 10px; background: #f2f2f2; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.3s; }
    .prize.selected { transform: scale(1.3); border: 2px solid gold; }
    button { margin-top: 30px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

<h1>Испытай удачу!</h1>
<div id="wheel"></div>
<button id="spinBtn">Прокрутить</button>

<script>
  const prizes = [
    { name: "М5 F90", emoji: "🚗" },
    { name: "1кк виртов", emoji: "💎" },
    { name: "Приз 3", emoji: "🎁" },
    { name: "Приз 4", emoji: "🎁" },
    { name: "Приз 5", emoji: "🎁" }
  ];

  const wheel = document.getElementById('wheel');
  prizes.forEach((p, index) => {
    const div = document.createElement('div');
    div.className = 'prize';
    div.innerHTML = `<div style="font-size:40px">${p.emoji}</div><div>${p.name}</div>`;
    wheel.appendChild(div);
  });

  const spinBtn = document.getElementById('spinBtn');
  spinBtn.onclick = () => {
    const prizeElements = document.querySelectorAll('.prize');
    prizeElements.forEach(p => p.classList.remove('selected'));

    // Случайный индекс
    const selectedIndex = Math.floor(Math.random() * prizes.length);
    const selectedPrize = prizeElements[selectedIndex];
    selectedPrize.classList.add('selected');

    // Прокручиваем колесо к выбранному призу
    selectedPrize.scrollIntoView({ behavior: 'smooth', inline: 'center' });

    setTimeout(() => {
      alert(`Поздравляем! Вы выиграли: ${prizes[selectedIndex].name}`);
    }, 800);
  };
</script>

</body>
</html>
